name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,mcp]'
      - run: python -m pip install 'stackchan-control[serial] @ git+https://github.com/AgenticForge-Labs/stackchan-control-sdk.git@391ccb9b5ff777fbd88df6a97e2477161a34c7ec'
      - run: pytest -q
      - run: ruff check src/forge_puppeteer/behavior_contract.py src/forge_puppeteer/conversation_ensemble.py src/forge_puppeteer/conversation_native.py src/forge_puppeteer/stackchan_validation.py src/forge_puppeteer/reachy_sync.py tests/test_conversation_ensemble.py tests/robots/test_conversation_native.py tests/robots/test_conversation_native_integration.py
